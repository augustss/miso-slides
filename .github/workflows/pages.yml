# Build the slides, and publish them with GitHub Pages, on every push to main.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one that is waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.10
          actions-cache-folder: emsdk-cache

      - name: Install miso-cli
        env:
          MISO_VERSION: v0.2.0
        run: |
          curl -fsSL https://haskell-miso.org/download | sh -s -- --yes --no-modify-path
          echo "$HOME/.miso/bin" >> "$GITHUB_PATH"

      - name: Build
        run: miso build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
